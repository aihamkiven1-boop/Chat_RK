<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الشرف والصدارة الحية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
        }
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 38px;
            margin-bottom: 30px;
        }
        .leaderboard-container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header-row {
            display: grid;
            grid-template-columns: 0.8fr 2fr 1.5fr 1.5fr;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            font-weight: bold;
            color: #38bdf8;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .player-row {
            display: grid;
            grid-template-columns: 0.8fr 2fr 1.5fr 1.5fr;
            padding: 18px 15px;
            border-bottom: 1px solid #334155;
            align-items: center;
            font-size: 19px;
        }
        .rank {
            font-weight: bold;
            font-size: 22px;
            text-align: center;
        }
        .rank-1 { color: #f59e0b; }
        .rank-2 { color: #94a3b8; }
        .rank-3 { color: #b45309; }
        .name { font-weight: bold; }
        .points { color: #10b981; font-weight: bold; }
        .rank-name { color: #38bdf8; font-size: 16px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>لوحة الشرف والصدارة لفرسان الحرب 🏆</h1>
    <div class="leaderboard-container">
        <div class="header-row">
            <div style="text-align: center;">المركز</div>
            <div>المقاتل</div>
            <div>الرصيد المالي</div>
            <div>الرتبة العسكرية</div>
        </div>
        <div id="leaderboardList">
            <!-- تحميل ديناميكي للترتيب -->
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    // جلب الترتيب من قاعدة البيانات عبر طلب تزامني
    async function fetchAndRenderLeaderboard() {
        try {
            const response = await fetch('/users_db.json');
            if (!response.ok) return;
            const db = await response.json();
            
            const container = document.getElementById('leaderboardList');
            container.innerHTML = '';

            const sorted = Object.entries(db).sort((a,b) => b[1].points - a[1].points).slice(0, 15);

            if(sorted.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 40px; color: #64748b;">لا توجد بيانات مسجلة للاعبين حالياً.</div>`;
                return;
            }

            // الرتب المحدثة لتصنيفها برمجياً
            const RANKS = [
                { name: '🆕 عابر مستجد', minPoints: 0 },
                { name: '🗡️ مقاتل نشط', minPoints: 100 },
                { name: '🛡️ كاسر النخبة', minPoints: 300 },
                { name: '🏅 جنرال مهيب', minPoints: 500 },
                { name: '👑 إمبراطور الحرب', minPoints: 1000 },
                { name: '🌌 أسطورة سرمدية', minPoints: 2000 }
            ];

            function getRankName(pts) {
                let rank = RANKS[0];
                for (const r of RANKS) {
                    if (pts >= r.minPoints) rank = r;
                }
                return rank.name;
            }

            sorted.forEach(([id, player], index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `
                    <div class="rank ${rankClass}">#${rank}</div>
                    <div class="name">@${id}</div>
                    <div class="points">${player.points} نقطة</div>
                    <div class="rank-name">${getRankName(player.points)}</div>
                `;
                container.appendChild(row);
            });
        } catch (e) {
            console.error("خطأ أثناء معالجة لوحة الشرف:", e);
        }
    }

    // التحديث الفوري عند حدوث تعديلات مالية بالنظام
    socket.on('statsUpdate', fetchAndRenderLeaderboard);
    socket.on('chatMessage', (data) => {
        if(data.isSystem) fetchAndRenderLeaderboard();
    });

    // تحميل أولي
    fetchAndRenderLeaderboard();
</script>
</body>
</html>
